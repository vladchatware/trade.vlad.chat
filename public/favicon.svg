<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
  </defs>
  <!-- Game bird silhouette -->
  <rect width="100" height="100" rx="20" fill="#0a0a0a"/>
  <!-- Body -->
  <ellipse cx="43" cy="52" rx="19" ry="15" fill="url(#bodyGrad)"/>
  <!-- Wing -->
  <ellipse cx="38" cy="50" rx="11" ry="8" fill="#15803d" opacity="0.8"/>
  <!-- Beak -->
  <polygon points="61,49 72,52 61,56" fill="#facc15"/>
  <!-- Eye -->
  <circle cx="50" cy="45" r="4" fill="#fff"/>
  <circle cx="51" cy="45" r="2" fill="#000"/>
  <!-- Tail feathers -->
  <polygon points="25,46 16,40 24,49" fill="#22c55e" opacity="0.7"/>
  <polygon points="25,56 16,64 24,57" fill="#16a34a" opacity="0.7"/>
